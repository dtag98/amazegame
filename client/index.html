<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amaze Game</title>
  </head>
  <body>
    <main>
      <h1>Amaze Game</h1>
      <section id="auth" hidden>
        <form id="register" method="post" action="/api/register">
          <h2>Create account</h2>
          <input name="username" placeholder="Username" aria-label="Username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}">
          <input name="password" type="password" placeholder="Password (10+ characters)" aria-label="Password" autocomplete="new-password" required minlength="10" maxlength="72">
          <button>Create account</button>
        </form>
        <form id="login" method="post" action="/api/login">
          <h2>Sign in</h2>
          <input name="username" placeholder="Username" aria-label="Username" autocomplete="username" required>
          <input name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
          <button>Sign in</button>
        </form>
      </section>
      <section id="account" hidden>
        <p id="welcome"></p>
        <button id="connect-game" type="button">Connect to game</button>
      </section>
      <button id="logout" type="button" hidden>Log out</button>
      <p id="status" role="status"></p>
      <section id="play" hidden>
        <p>Move with WASD. Chat messages are shown as text.</p>
        <div id="scene"></div>
        <form id="chat">
          <input name="message" maxlength="200" placeholder="Chat" aria-label="Chat message">
          <button>Send</button>
        </form>
        <ul id="messages"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
