services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [auth, game]
    restart: unless-stopped
  auth:
    build:
      context: .
      dockerfile: server/auth/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${APP_DB_USER:-game_app}:${APP_DB_PASSWORD:-change-this-app-password}@db:5432/${POSTGRES_DB:-amazegame}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_PRIVATE_KEY: /run/keys/private.pem
      JWT_PUBLIC_KEY: /run/keys/public.pem
    volumes: ["jwt-keys:/run/keys"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  game:
    build: .
    environment:
      PORT: 3002
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_PUBLIC_KEY: /run/keys/public.pem
    volumes: ["jwt-keys:/run/keys:ro"]
    depends_on:
      auth: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amazegame}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
      APP_DB_USER: ${APP_DB_USER:-game_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-this-app-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
  jwt-keys:
