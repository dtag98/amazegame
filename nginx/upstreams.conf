resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream amazegame_auth {
    zone amazegame_auth 64k;
    server auth:3001 resolve;
}

upstream amazegame_game {
    zone amazegame_game 64k;
    server game:3002 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
