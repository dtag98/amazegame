services:
  - type: pserv
    name: amazegame-auth
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./server/auth/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: amazegame-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "true"
      - key: TRUST_PROXY_ORIGIN
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - fromGroup: amazegame-secrets
  - type: web
    name: amazegame
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_ORIGIN
        fromService:
          type: web
          name: amazegame
          envVarKey: RENDER_EXTERNAL_URL
      - key: COOKIE_SECURE
        value: "true"
      - key: AUTH_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: amazegame-auth
          property: hostport
      - fromGroup: amazegame-secrets
databases:
  - name: amazegame-db
    plan: basic-256mb
    region: ohio
    databaseName: amazegame
    user: amazegame

envVarGroups:
  - name: amazegame-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
